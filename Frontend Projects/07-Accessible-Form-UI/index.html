<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/7.0.1/css/all.min.css"
      integrity="sha512-2SwdPD6INVrV/lHTZbO2nodKhrnDdJK9/kg2XD1r9uGqPo1cUbujc+IYdlYdEErWNu69gVcYgdxlmVmzTWnetw=="
      crossorigin="anonymous"
      referrerpolicy="no-referrer"
    />
    <link rel="stylesheet" href="src/output.css" />
    <title>Accessible Form UI</title>
  </head>
  <body>
    <div class="max-w-1/2 shrink-0 bg-gray-900 mx-auto p-5 flex">
      <!-- Form -->
      <form class="basis-1/2" action="">
        <div class="text-white space-y-2">
          <div class="flex flex-col space-y-1">
            <label for="fullName" class="text-2xl">Full Name</label>
            <input
              type="text"
              id="fullName"
              placeholder="What should we call you?"
              class="border-white border rounded-xl w-xs p-1"
              title="Enter You're Full Name"
              required
            />
            <span></span>
          </div>

          <div class="flex flex-col space-y-1">
            <label for="email" class="text-2xl">Email</label>
            <input
              type="email"
              name="email"
              id="email"
              class="border-white border rounded-xl w-xs p-1"
              placeholder="name@example.com"
              title="Enter You're Email"
              required
            />
            <span class="text-red-400 text-sm">Email is already taken</span>
          </div>

          <div class="flex flex-col space-y-1">
            <label for="enterPassword" class="text-2xl">Enter Password</label>
            <input
              type="password"
              name="enterPassword"
              id="enterPassword"
              class="border-white border w-xs p-1 rounded-xl"
              placeholder="Create A Password"
              title="Password Must Contain Atleast 8 Characters"
              required
            />
            <span class="text-red-400 text-sm"
              >Password must contain atleast 8 characters</span
            >
          </div>

          <div class="flex flex-col space-y-1">
            <label for="confirmPassword" class="text-2xl"
              >Confirm Password</label
            >
            <input
              type="password"
              name="confirmPassword"
              id="confirmPassword"
              class="border-white border rounded-xl w-xs p-1"
              placeholder="Confirm Password"
              title="Enter You're Password Again"
              required
            />
            <span class="text-red-400 text-sm">Password Must Match</span>
          </div>
          <button
            class="bg-white text-black w-xs p-1 mt-2 rounded-2xl hover:bg-orange-300 hover:font-bold"
          >
            Update Profile
          </button>
        </div>
      </form>

      <!-- Profile Percentage -->
      <div class="basis-1/2 flex-col flex justify-center">
        <div class="relative w-30 h-30 mx-auto">
          <div
            class="w-full h-full rounded-full"
            style="
              background: conic-gradient(
                white 0% 65%,
                rgba(255, 255, 255, 0.2) 65% 100%
              );
            "
          ></div>

          <div
            class="absolute inset-1 rounded-full bg-black flex items-center justify-center"
          >
            <span class="text-white text-3xl">65%</span>
          </div>
        </div>

        <span class="text-white text-2xl text-center my-4"
          >Profile Completeness</span
        >

        <div class="bg-gray-800 text-white p-5 rounded-2xl w-fit mx-auto">
          <p class="line-through">Create Account</p>
          <p class="line-through">Update Roadmap Progress</p>
          <p class="line-through">Setup Public Profile</p>
          <p class="">Complete your first project</p>
          <p class="">Invite your Friends</p>
        </div>
      </div>
    </div>
  </body>
</html>
