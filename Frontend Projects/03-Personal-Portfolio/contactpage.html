<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <!-- SEO META -->
    <meta name="description" content="Contact" />
    <meta name="author" content="Mordiles" />
    <meta name="keywords" content="contact, Mordiles, roadmap.sh" />
    <title>Mordiles Contact</title>
    <link rel="stylesheet" href="src/output.css" />
    <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/7.0.1/css/all.min.css"
      integrity="sha512-2SwdPD6INVrV/lHTZbO2nodKhrnDdJK9/kg2XD1r9uGqPo1cUbujc+IYdlYdEErWNu69gVcYgdxlmVmzTWnetw=="
      crossorigin="anonymous"
      referrerpolicy="no-referrer"
    />
  </head>
  <body class="dark:bg-slate-900 dark:text-white">
    <header
      class="mx-auto flex items-center justify-between shadow-md ps-6 pe-6 py-1 dark:bg-slate-900 dark:shadow-gray-950"
    >
      <div class="flex items-center gap-3">
        <img src="../assets/favicon.ico" alt="logo" />
        <p class="dark:text-white hidden sm:block">Mordiles</p>
      </div>
      
      <nav class="flex gap-6 text-blue-400 dark:text-white font-medium">
        <ul class="flex m-5 gap-6">
          <li class="hover:text-slate-900 dark:hover:text-blue-300">
            <a href="index.html">Home</a>
          </li>
          <li class="hover:text-slate-900 dark:hover:text-blue-300">
            <a href="projects.html">Projects</a>
          </li>
          <li class="hover:text-slate-900 dark:hover:text-blue-300">
            <a href="article.html">Articles</a>
          </li>
          <li class="hover:text-slate-900 dark:hover:text-blue-300">
            <a href="contactpage.html">Contact</a>
          </li>
          <li>
            <button>
              <i
                class="fa-regular fa-moon fa-lg text-blue-300 hover:text-slate-900 dark:hover:text-blue-300 dark:text-white"
                id="modeToggle"
              ></i>
            </button>
          </li>
        </ul>
      </nav>
    </header>

    <main>
      <h1 class="text-4xl font-bold text-center py-15 font-serif">
        Contact Page
      </h1>
      <form
        action=""
        class="mx-auto w-2/3 lg:w-1/3 mt-10 p-5 space-y-5 rounded-3xl text-gray-800 mb-15 shadow-sm shadow-gray-800 inset-shadow-sm inset-shadow-gray-800 dark:shadow-gray-800"
      >
        <p class="font-bold text-2xl font-serif dark:text-white">Name:</p>
        <input class="border w-full p-1 dark:text-white" type="text" />
        <p class="font-bold text-2xl font-serif dark:text-white">Email:</p>
        <input class="border w-full p-1 dark:text-white" type="email" name="" id="" />
        <p class="font-bold text-2xl font-serif dark:text-white">Message:</p>
        <input class="border w-full p-1 dark:text-white" type="text" />
        <div class="flex justify-end">
          <input
            type="submit"
            value="Send"
            name="send"
            class="border py-1 px-3 hover:cursor-pointer ml-auto bg-blue-500 text-white text-2xl font-bold"
          />
        </div>
      </form>
    </main>
    <footer
      class="text-center inset-shadow-sm text-xl lg:text-2xl p-5 font-mono mt-5 dark:shadow-slate-900 dark:inset-shadow-gray-950"
    >
      <h3>© all rights reserved 2025</h3>
    </footer>
  </body>
</html>
<script src="darkMode.js"></script>
