<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="stylesheet" href="src/output.css" />
    <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/7.0.1/css/all.min.css"
      integrity="sha512-2SwdPD6INVrV/lHTZbO2nodKhrnDdJK9/kg2XD1r9uGqPo1cUbujc+IYdlYdEErWNu69gVcYgdxlmVmzTWnetw=="
      crossorigin="anonymous"
      referrerpolicy="no-referrer"
    />
    <title>Datepicker UI</title>
  </head>
  <body>
    <div class="m-5">
      <!-- input and date button -->
      <div class="flex mb-2">
        <input
          class="border h-10 p-1"
          type="text"
          placeholder="dd / mm / yyyy"
        />
        <button class="h-10 p-2 border border-l-0 cursor-pointer">
          <i class="fa-solid fa-calendar-days text-center"></i>
        </button>
      </div>

      <!-- Calendar Header -->
      <div class="border w-57">
        <div class="text-center text-xl">
          <button class="cursor-pointer">
            <i class="fa-solid fa-caret-left"></i>
          </button>
          <span class="mx-2">January 2026</span>
          <button class="cursor-pointer">
            <i class="fa-solid fa-caret-right"></i>
          </button>
        </div>
        <div class="grid grid-cols-7 text-sm place-items-center">
          <span>Sun</span>
          <span>Mon</span>
          <span>Tue</span>
          <span>Wed</span>
          <span>Thu</span>
          <span>Fri</span>
          <span>Sat</span>
        </div>
      </div>

      <!-- Main Calendar -->
      <div
        class="grid grid-cols-7 text-sm place-items-center border w-57 pt-1 *:w-7 *:h-7 *:flex *:justify-center *:items-center *:rounded-full *:hover:bg-gray-200 *:hover:cursor-pointer"
      >
        <span class="hover:text-black text-gray-400">28</span>
        <span class="hover:text-black text-gray-400">29</span>
        <span class="hover:text-black text-gray-400">30</span>
        <span class="hover:text-black text-gray-400">31</span>
        <span>1</span>
        <span>2</span>
        <span>3</span>
        <span>4</span>
        <span>5</span>
        <span>6</span>
        <span>7</span>
        <span>8</span>
        <span>9</span>
        <span>10</span>
        <span>11</span>
        <span>12</span>
        <span>13</span>
        <span>14</span>
        <span>15</span>
        <span>16</span>
        <span>17</span>
        <span>18</span>
        <span>19</span>
        <span>20</span>
        <span>21</span>
        <span>22</span>
        <span>23</span>
        <span>24</span>
        <span>25</span>
        <span>26</span>
        <span>27</span>
        <span>28</span>
        <span>29</span>
        <span>30</span>
        <span>31</span>
      </div>
    </div>
  </body>
</html>
