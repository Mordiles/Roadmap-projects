<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="stylesheet" href="src/output.css" />
    <title>Image Grid Layout</title>
  </head>
  <body>
    <div class="grid grid-cols-1 grid-rows-6 sm:grid-cols-2 sm:grid-rows-3 md:grid-cols-3 md:grid-rows-3 gap-2 items-center p-2">
      <img
        src="https://images.unsplash.com/photo-1725060555163-c1fd4f569925?q=80&w=387&auto=format&fit=crop&ixlib=rb-4.1.0&ixid=M3wxMjA3fDB8MHxwaG90by1wYWdlfHx8fGVufDB8fHx8fA%3D%3D"
        alt=""
        class="w-full h-full object-cover sm:row-start-1 sm:row-end-2 sm:col-start-1 sm:col-end-2 md:row-start-1 md:col-start-1 md:row-end-3 md:col-end-2"
      />
      <img
        src="https://images.unsplash.com/photo-1725042893312-5ec0dea9e369?q=80&w=870&auto=format&fit=crop&ixlib=rb-4.1.0&ixid=M3wxMjA3fDB8MHxwaG90by1wYWdlfHx8fGVufDB8fHx8fA%3D%3D"
        class="w-full h-full object-cover sm:row-start-2 sm:row-end-3 sm:col-start-1 sm:col-end-2 md:row-start-3 md:row-end-4 md:col-start-1 md:col-end-2"
      />
      <img
        src="https://plus.unsplash.com/premium_photo-1695582868702-5b0f91584d00?q=80&w=870&auto=format&fit=crop&ixlib=rb-4.1.0&ixid=M3wxMjA3fDB8MHxwaG90by1wYWdlfHx8fGVufDB8fHx8fA%3D%3D"
        class="w-full h-full object-cover sm:row-start-1 sm:row-end-2 sm:col-start-2 sm:col-end-3 md:row-start-1 md:row-end-2 md:col-start-2 md:col-end-3"
      />
      <img
        src="https://images.unsplash.com/photo-1724862830679-954d49573f3f?q=80&w=387&auto=format&fit=crop&ixlib=rb-4.1.0&ixid=M3wxMjA3fDB8MHxwaG90by1wYWdlfHx8fGVufDB8fHx8fA%3D%3D"
        class="w-full h-full object-cover sm:row-start-2 sm:row-end-3 sm:col-start-2 sm:col-end-3  md:row-start-2 md:row-end-4 md:col-start-2 md:col-end-3"
      />
      <img
        src="https://images.unsplash.com/photo-1724747891638-68862b7b3165?q=80&w=387&auto=format&fit=crop&ixlib=rb-4.1.0&ixid=M3wxMjA3fDB8MHxwaG90by1wYWdlfHx8fGVufDB8fHx8fA%3D%3D"
        class="w-full h-full object-cover sm:row-start-3 sm:row-end-4 sm:col-start-1 sm:col-end-2 md:row-start-1 md:row-end-3 md:col-start-3 md:col-end-4"
      />
      <img
        src="https://plus.unsplash.com/premium_photo-1724863374168-cc3334387b81?q=80&w=870&auto=format&fit=crop&ixlib=rb-4.1.0&ixid=M3wxMjA3fDB8MHxwaG90by1wYWdlfHx8fGVufDB8fHx8fA%3D%3D"
        class="w-full h-full object-cover sm:row-start-3 sm:row-end-4 sm:col-start-2 sm:col-end-3 md:row-start-3 md:row-end-4 md:col-start-3 md:col-end-4"
      />
    </div>
  </body>
</html>
